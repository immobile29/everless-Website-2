<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repertuaari – Everless</title>
  <meta name="description" content="Everlessin repertuaari: pop-, rock- ja country-biisit hakuineen ja 30 sekunnin esikuunteluineen.">
  <meta name="theme-color" content="#16100c">
  <meta property="og:title" content="Everless – Cover band & DJs">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/band/band.webp">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Rye&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">

  <script src="data/site.config.js"></script>
  <script src="js/gate.js"></script>
  <script>
    (function () {
      var t = (new URLSearchParams(location.search).get("theme")) || window.EVERLESS_CONFIG.theme;
      document.documentElement.setAttribute("data-theme", t === "modern" ? "modern" : "western");
    })();
  </script>
</head>
<body data-page="repertoire">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Siirry sisältöön</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="rep.eyebrow">Repertuaari</p>
        <h1 data-i18n="rep.title"></h1>
        <p class="lead" data-i18n-html="rep.lead"></p>
      </div>
    </section>

    <section class="section section-alt" id="repertoire">
      <div class="container">
        <div class="rep-controls">
          <div class="tabs" role="tablist" id="rep-tabs"></div>
          <label class="search">
            <span class="sr-only" data-i18n="rep.searchLabel">Hae biisejä</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
            <input type="search" id="rep-search" autocomplete="off" data-i18n-attr="placeholder:rep.search">
          </label>
        </div>
        <p class="rep-count" id="rep-count" aria-live="polite"></p>
        <ul class="song-list" id="song-list"></ul>
        <p class="fineprint" data-i18n="rep.credit"></p>
      </div>
    </section>

    <div class="cta-band">
      <div class="container">
        <a class="btn" href="index.html#book" data-i18n="hero.cta">Pyydä tarjous</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="data/songs.js"></script>
  <script src="data/content.js"></script>
  <script src="data/previews.js"></script>
  <script src="data/i18n/fi.js"></script>
  <script src="data/i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/repertoire.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
