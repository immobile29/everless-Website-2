<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bändi, galleria ja videot – Everless</title>
  <meta name="description" content="Tutustu Everlessin jäseniin ja DJ:hin, katso kuvia ja videoita bändin keikoilta.">
  <meta name="theme-color" content="#16100c">
  <meta property="og:title" content="Everless – Cover band & DJs">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/band/band.webp">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Rye&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">

  <script src="data/site.config.js"></script>
  <script src="js/gate.js"></script>
  <script>
    (function () {
      var t = (new URLSearchParams(location.search).get("theme")) || window.EVERLESS_CONFIG.theme;
      document.documentElement.setAttribute("data-theme", t === "modern" ? "modern" : "western");
    })();
  </script>
</head>
<body data-page="gallery">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Siirry sisältöön</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="page.gallery.eyebrow"></p>
        <h1 data-i18n="page.gallery.title"></h1>
        <p class="lead" data-i18n="page.gallery.lead"></p>
      </div>
    </section>

    <!-- KOKOONPANO -->
    <section class="section" id="members">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow" data-i18n="members.eyebrow">Kokoonpano</p>
          <h2 data-i18n="members.title"></h2>
          <p class="lead" data-i18n="members.lead"></p>
        </header>

        <figure class="wide-photo">
          <img src="assets/img/band/boys.webp" width="1800" height="1200" loading="lazy" alt="" data-i18n-attr="alt:members.photo.alt">
        </figure>

        <h3 class="subhead" data-i18n="members.band">Bändi</h3>
        <div class="member-grid" id="member-grid"></div>

        <h3 class="subhead" data-i18n="members.djs">DJ:t</h3>
        <div class="dj-block">
          <figure class="dj-photo">
            <img src="assets/img/band/djs.webp" width="1800" height="1200" loading="lazy" alt="" data-i18n-attr="alt:members.djs.alt">
          </figure>
          <div class="dj-info">
            <p data-i18n="members.djs.text"></p>
            <div class="member-grid member-grid-small" id="dj-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- GALLERIA -->
    <section class="section section-alt" id="gallery">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow" data-i18n="gallery.eyebrow">Galleria</p>
          <h2 data-i18n="gallery.title"></h2>
          <p class="lead" data-i18n="gallery.lead"></p>
        </header>
        <div class="gallery-featured" id="gallery-featured"></div>
        <div class="gallery" id="gallery-grid"></div>
        <p class="fineprint photo-credit" data-i18n="gallery.credit"></p>
      </div>
    </section>

    <!-- VIDEOT -->
    <section class="section" id="videos">
      <div class="container">
        <header class="section-head">
          <p class="eyebrow" data-i18n="videos.eyebrow">Videot</p>
          <h2 data-i18n="videos.title"></h2>
          <p class="lead" data-i18n="videos.lead"></p>
        </header>
        <div class="card-grid cols-2" id="video-grid"></div>
      </div>
    </section>

    <div class="cta-band">
      <div class="container">
        <a class="btn" href="index.html#book" data-i18n="hero.cta">Pyydä tarjous</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <button class="lb-btn lb-close" type="button" data-i18n-attr="aria-label:a11y.close">&times;</button>
    <button class="lb-btn lb-prev" type="button" data-i18n-attr="aria-label:gallery.prev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    </button>
    <img class="lb-img" id="lb-img" alt="">
    <button class="lb-btn lb-next" type="button" data-i18n-attr="aria-label:gallery.next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6L10 18l6-6-6-6-1.4 1.4L13.2 12z"/></svg>
    </button>
  </div>

  <script src="data/songs.js"></script>
  <script src="data/content.js"></script>
  <script src="data/i18n/fi.js"></script>
  <script src="data/i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
